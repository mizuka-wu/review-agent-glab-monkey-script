# GitLab CE 测试容器
# 启动: ./scripts/gitlab.sh start
# 访问: http://localhost:8929 (root / 5iveRage)

services:
  gitlab:
    image: gitlab/gitlab-ce:latest
    platform: linux/amd64
    container_name: gitlab-test
    hostname: gitlab.test
    ports:
      - "8929:8929"
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://localhost:8929'
    volumes:
      - gitlab_data:/var/opt/gitlab
      - gitlab_logs:/var/log/gitlab
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8929/users/sign_in"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 120s

volumes:
  gitlab_data:
  gitlab_logs:
