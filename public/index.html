<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Review Agent for GitLab userscript prototype." />
    <title>Review Agent for GitLab</title>
    <style>
      :root {
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        color: #1f2937;
        background: #eef1f5;
      }
      body {
        min-height: 100vh;
        margin: 0;
        background: #eef1f5;
      }
      main {
        width: min(760px, calc(100% - 32px));
        margin: 0 auto;
        padding: 72px 0 48px;
      }
      .mark {
        display: grid;
        width: 42px;
        height: 42px;
        place-items: center;
        color: #fff;
        background: #245fc7;
        border-radius: 8px;
        font-weight: 700;
      }
      h1 {
        margin: 20px 0 12px;
        font-size: 34px;
        letter-spacing: 0;
      }
      p {
        max-width: 660px;
        color: #566477;
        line-height: 1.7;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin: 28px 0;
      }
      a.button {
        display: inline-flex;
        min-height: 40px;
        align-items: center;
        padding: 9px 14px;
        color: #fff;
        background: #245fc7;
        border: 1px solid #245fc7;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 650;
        text-decoration: none;
      }
      a.button.secondary {
        color: #283648;
        background: #fff;
        border-color: #c9d2de;
      }
      section {
        margin-top: 34px;
        padding: 20px;
        background: #fff;
        border: 1px solid #d9e0e8;
        border-radius: 8px;
      }
      h2 {
        margin: 0 0 12px;
        font-size: 18px;
        letter-spacing: 0;
      }
      ul {
        margin: 0;
        padding-left: 20px;
        color: #526175;
        line-height: 1.9;
      }
      code {
        padding: 2px 5px;
        color: #27364a;
        background: #eef2f6;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">RA</div>
      <h1>Review Agent for GitLab</h1>
      <p>
        面向 GitLab Merge Request 的油猴脚本原型，提供划词提问、选中代码 Review、结构化 Finding
        和确认后发布评论的完整交互设计。
      </p>
      <div class="actions">
        <a class="button" href="./review-agent-glab-monkey-script.user.js">安装原型脚本</a>
        <a class="button secondary" href="./docs/00-product-brief.md">产品计划</a>
        <a class="button secondary" href="./docs/01-capability-boundary.md">能力边界</a>
      </div>
      <section>
        <h2>当前阶段</h2>
        <ul>
          <li>交互原型不发送真实 GitLab 或模型请求。</li>
          <li>构建产物由 GitHub Actions 自动打包。</li>
          <li>创建 <code>v*</code> tag 会自动生成 GitHub Release。</li>
          <li>评论发布、真实模型和本地 Gateway 仍在后续里程碑中。</li>
        </ul>
      </section>
    </main>
  </body>
</html>
